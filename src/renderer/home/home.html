<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'">
<title>Camellia</title>
<link rel="stylesheet" href="../shared/ui-theme.css">
<link rel="stylesheet" href="./home.css">
</head>
<body>
<main class="home-panel">
  <header class="home-heading">
    <div class="home-brand"><img src="../../../assets/icon-256.png" alt="Camellia cat" width="38" height="38">Camellia</div>
    <h1>Start working</h1>
    <p>Choose an engine to continue your work.</p>
  </header>
  <nav class="home-entries" aria-label="Engines">
    <button class="agent-entry" id="enterDsh" data-mode="dsh" aria-label="Open DSH">
      <span class="agent-symbol" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="m7 9 3 3-3 3m6 0h4"/></svg></span>
      <span class="entry-title">DeepSeek Harness</span>
      <span class="entry-description">Work on conversations, projects, and goals in your workspace.</span>
      <span class="entry-action">Open DSH <span aria-hidden="true">↗</span></span>
    </button>
    <button class="agent-entry" id="enterClaude" data-mode="claude" aria-label="Open Claude">
      <span class="agent-symbol claude-symbol" aria-hidden="true">C</span>
      <span class="entry-title">Claude Code</span>
      <span class="entry-description">Continue in a workspace or start a standalone conversation.</span>
      <span class="entry-action">Open Claude <span aria-hidden="true">↗</span></span>
    </button>
    <button class="agent-entry" id="enterKimi" data-mode="kimi" aria-label="Open Kimi">
      <span class="agent-symbol kimi-symbol" aria-hidden="true">K</span>
      <span class="entry-title">Kimi Code</span>
      <span class="entry-description">Use the open-source Kimi engine with Camellia's shared API routes.</span>
      <span class="entry-action">Open Kimi <span aria-hidden="true">↗</span></span>
    </button>
    <button class="config-entry" id="openConfig" aria-label="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4 7h7m6 0h3M4 17h3m6 0h7"/><circle cx="14" cy="7" r="3"/><circle cx="10" cy="17" r="3"/></svg>
      <span><span class="config-title">Settings</span><span class="entry-description">Providers, keys, usage, and balances</span></span>
      <span class="config-arrow" aria-hidden="true">→</span>
    </button>
  </nav>
  <p id="homeStatus" role="status" aria-live="polite"></p>
</main>
<script src="./home.js"></script>
</body>
</html>
