plugins {
    id 'com.android.application'
}

def releaseSigning = [
    storeFile: System.getenv('CAMELLIA_ANDROID_KEYSTORE'),
    storePassword: System.getenv('CAMELLIA_ANDROID_KEYSTORE_PASSWORD'),
    keyAlias: System.getenv('CAMELLIA_ANDROID_KEY_ALIAS'),
    keyPassword: System.getenv('CAMELLIA_ANDROID_KEY_PASSWORD'),
]
def releaseSigningConfigured = releaseSigning.values().every { it?.trim() }

android {
    namespace 'app.camellia.mobile'
    compileSdk 35
    useLibrary 'android.test.runner'
    useLibrary 'android.test.base'

    defaultConfig {
        applicationId 'app.camellia.mobile'
        minSdk 26
        targetSdk 35
        versionCode 79
        versionName '1.0.0'
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    bundle {
        language { enableSplit = false }
    }

    signingConfigs {
        if (releaseSigningConfigured) {
            release {
                storeFile file(releaseSigning.storeFile)
                storePassword releaseSigning.storePassword
                keyAlias releaseSigning.keyAlias
                keyPassword releaseSigning.keyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (releaseSigningConfigured) signingConfig signingConfigs.release
        }
    }
}

tasks.matching { it.name == 'preReleaseBuild' }.configureEach {
    doFirst {
        if (!releaseSigningConfigured)
            throw new GradleException('Release signing is required. Set CAMELLIA_ANDROID_KEYSTORE, CAMELLIA_ANDROID_KEYSTORE_PASSWORD, CAMELLIA_ANDROID_KEY_ALIAS, and CAMELLIA_ANDROID_KEY_PASSWORD.')
        if (!file(releaseSigning.storeFile).isFile())
            throw new GradleException('Release keystore file does not exist.')
    }
}

dependencies {
    implementation files('libs/tailnet.aar')
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'org.commonmark:commonmark:0.21.0'
    implementation 'org.commonmark:commonmark-ext-gfm-tables:0.21.0'
    implementation 'org.commonmark:commonmark-ext-gfm-strikethrough:0.21.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.jsoup:jsoup:1.18.3'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}

def desktopIconResources = layout.buildDirectory.dir('generated/desktopIcon/res')
def generateDesktopIcon = tasks.register('generateDesktopIcon', Copy) {
    from(rootProject.file('../assets/icon-1024.png'))
    into(desktopIconResources.map { it.dir('drawable-nodpi') })
    rename { 'desktop_logo.png' }
}
android.sourceSets.main.res.srcDir(desktopIconResources)
tasks.named('preBuild').configure { dependsOn(generateDesktopIcon) }
