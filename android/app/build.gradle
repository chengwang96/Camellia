plugins {
    id 'com.android.application'
}

def releaseSigning = [
    storeFile: System.getenv('CAMELLIA_ANDROID_KEYSTORE'),
    storePassword: System.getenv('CAMELLIA_ANDROID_KEYSTORE_PASSWORD'),
    keyAlias: System.getenv('CAMELLIA_ANDROID_KEY_ALIAS'),
    keyPassword: System.getenv('CAMELLIA_ANDROID_KEY_PASSWORD'),
]
def releaseSigningConfigured = releaseSigning.values().every { it?.trim() }
def sizeBaseline = providers.gradleProperty('camelliaSizeBaseline').map { it.toBoolean() }.getOrElse(false)
def splitRelease = providers.gradleProperty('camelliaSplitApks').map { it.toBoolean() }.getOrElse(false)
def releaseSmoke = providers.gradleProperty('camelliaReleaseSmoke').map { it.toBoolean() }.getOrElse(false)

android {
    namespace 'app.camellia.mobile'
    compileSdk 35
    useLibrary 'android.test.runner'
    useLibrary 'android.test.base'

    defaultConfig {
        applicationId 'app.camellia.mobile'
        minSdk 26
        targetSdk 35
        versionCode 90
        versionName '1.0.0'
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
        if (releaseSmoke) testApplicationId 'app.camellia.mobile.release.test'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    bundle {
        language { enableSplit = false }
    }

    signingConfigs {
        if (releaseSigningConfigured) {
            release {
                storeFile file(releaseSigning.storeFile)
                storePassword releaseSigning.storePassword
                keyAlias releaseSigning.keyAlias
                keyPassword releaseSigning.keyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled !sizeBaseline
            shrinkResources !sizeBaseline
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (releaseSigningConfigured) signingConfig signingConfigs.release
        }
    }

    packaging { jniLibs { useLegacyPackaging = false } }
    splits {
        abi {
            enable splitRelease
            reset()
            include 'arm64-v8a', 'x86_64'
            universalApk false
        }
    }
    if (releaseSmoke) {
        testBuildType 'release'
        sourceSets.androidTest.java.setSrcDirs(['src/releaseTest/java'])
        sourceSets.androidTest.assets.setSrcDirs(['src/releaseTest/assets'])
        sourceSets.androidTest.manifest.srcFile('src/releaseTest/AndroidManifest.xml')
    }
}

tasks.matching { it.name == 'preReleaseBuild' }.configureEach {
    doFirst {
        if (!releaseSigningConfigured)
            throw new GradleException('Release signing is required. Set CAMELLIA_ANDROID_KEYSTORE, CAMELLIA_ANDROID_KEYSTORE_PASSWORD, CAMELLIA_ANDROID_KEY_ALIAS, and CAMELLIA_ANDROID_KEY_PASSWORD.')
        if (!file(releaseSigning.storeFile).isFile())
            throw new GradleException('Release keystore file does not exist.')
    }
}

dependencies {
    implementation files('libs/tailnet.aar')
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'org.commonmark:commonmark:0.21.0'
    implementation 'org.commonmark:commonmark-ext-gfm-tables:0.21.0'
    implementation 'org.commonmark:commonmark-ext-gfm-strikethrough:0.21.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.jsoup:jsoup:1.18.3'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}

def desktopIconResources = layout.buildDirectory.dir('generated/desktopIcon/res')
def generateDesktopIcon = tasks.register('generateDesktopIcon') {
    def source = rootProject.file('../assets/icon-1024.png')
    def destination = desktopIconResources.map { it.file('drawable-nodpi/desktop_logo.png') }
    def pixels = sizeBaseline ? 1024 : 256
    inputs.file(source)
    inputs.property('pixels', pixels)
    outputs.file(destination)
    doLast {
        def input = javax.imageio.ImageIO.read(source)
        def result = new java.awt.image.BufferedImage(pixels, pixels, java.awt.image.BufferedImage.TYPE_INT_ARGB)
        def graphics = result.createGraphics()
        try {
            graphics.setRenderingHint(java.awt.RenderingHints.KEY_INTERPOLATION, java.awt.RenderingHints.VALUE_INTERPOLATION_BICUBIC)
            graphics.drawImage(input, 0, 0, pixels, pixels, null)
        } finally { graphics.dispose(); input.flush() }
        def file = destination.get().asFile
        file.parentFile.mkdirs()
        if (!javax.imageio.ImageIO.write(result, 'png', file)) throw new GradleException('Cannot encode Android brand image')
        result.flush()
    }
}
android.sourceSets.main.res.srcDir(desktopIconResources)
tasks.named('preBuild').configure { dependsOn(generateDesktopIcon) }

// APK updates can leave unreferenced native-library payloads in an incremental ZIP.
// Remove only the selected APK output before packaging; compilation and library caches stay reusable.
['Debug': 'debug', 'Release': 'release', 'DebugAndroidTest': 'androidTest/debug', 'ReleaseAndroidTest': 'androidTest/release'].each { suffix, directory ->
    def apkDirectory = layout.buildDirectory.dir("outputs/apk/$directory")
    def fresh = tasks.register("fresh${suffix}Apk", Delete) {
        delete(apkDirectory)
        doFirst {
            def allowed = project.file('build/outputs/apk').canonicalFile.toPath()
            def target = apkDirectory.get().asFile.canonicalFile.toPath()
            if (!target.startsWith(allowed) || target == allowed) throw new GradleException('APK output is outside the allowed build directory')
        }
    }
    tasks.matching { it.name == "package$suffix" }.configureEach { dependsOn(fresh) }
}
