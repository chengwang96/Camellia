<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Code</title>
<style>
  :root { color-scheme: dark; font-family: "Segoe UI","Microsoft YaHei UI",Arial,sans-serif; }
  html, body { margin:0; height:100%; }
  body { display:flex; flex-direction:column; background:#0e141c; color:#d7e0ea; }
  header { display:flex; align-items:center; gap:12px; padding:10px 16px; background:#171f2a; border-bottom:1px solid #2b3a4b; }
  header .title { font-size:15px; font-weight:700; }
  header .session { font-size:12px; color:#8da0b4; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  header button { padding:6px 12px; border-radius:8px; border:1px solid #2b3a4b; background:#1f2a37; color:inherit; font-size:12.5px; cursor:pointer; }
  header button:hover { background:#26323f; }
  header button.primary { background:#0f7f91; border-color:#0f7f91; color:#fff; }
  #settingsPanel { display:none; padding:14px 16px; background:#171f2a; border-bottom:1px solid #2b3a4b; }
  #settingsPanel.open { display:block; }
  #settingsPanel .grid { display:grid; grid-template-columns:1fr 1fr; gap:10px 16px; }
  #settingsPanel label { display:block; font-size:12px; color:#8da0b4; margin-bottom:4px; }
  #settingsPanel input, #settingsPanel select { width:100%; box-sizing:border-box; padding:7px 9px; border-radius:7px; border:1px solid #2b3a4b; background:#111923; color:inherit; font-size:12.5px; }
  #settingsPanel .full { grid-column:1 / -1; }
  #settingsPanel .hint { font-size:11.5px; color:#8da0b4; margin:8px 0 0; line-height:1.5; }
  main { flex:1; overflow-y:auto; padding:16px; }
  .msg { margin-bottom:14px; max-width:860px; }
  .msg.user { margin-left:auto; }
  .msg .bubble { padding:10px 14px; border-radius:12px; font-size:13.5px; line-height:1.6; white-space:pre-wrap; word-break:break-word; }
  .msg.user .bubble { background:#0f7f91; color:#fff; border-bottom-right-radius:4px; }
  .msg.assistant .bubble { background:#171f2a; border:1px solid #2b3a4b; border-bottom-left-radius:4px; }
  .msg .meta { font-size:11px; color:#8da0b4; margin-top:4px; }
  .msg.user .meta { text-align:right; }
  .tool { margin:8px 0; border:1px solid #2b3a4b; border-radius:8px; background:#111923; overflow:hidden; }
  .tool .head { display:flex; align-items:center; gap:8px; padding:6px 10px; font-size:12px; cursor:pointer; color:#7bc7ff; }
  .tool .head .name { font-weight:600; }
  .tool .head .arrow { transition:transform .15s; }
  .tool .body { display:none; padding:8px 10px; border-top:1px solid #2b3a4b; font-size:12px; white-space:pre-wrap; word-break:break-word; color:#aeb9c6; max-height:300px; overflow:auto; }
  .tool.open .body { display:block; }
  .tool.open .head .arrow { transform:rotate(90deg); }
  .thinking { margin:8px 0; padding:8px 10px; border-radius:8px; background:#141b24; border:1px dashed #2b3a4b; font-size:12px; color:#8da0b4; white-space:pre-wrap; word-break:break-word; }
  .result { margin:8px 0; padding:8px 10px; border-radius:8px; font-size:12px; }
  .result.ok { background:#12241c; border:1px solid #1f4d38; color:#30a46c; }
  .result.err { background:#241418; border:1px solid #4d1f26; color:#e5484d; }
  .cursor { display:inline-block; width:7px; height:14px; background:#7bc7ff; vertical-align:-2px; animation:blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity:0; } }
  footer { display:flex; gap:10px; padding:12px 16px; background:#171f2a; border-top:1px solid #2b3a4b; }
  footer textarea { flex:1; box-sizing:border-box; padding:10px 12px; border-radius:10px; border:1px solid #2b3a4b; background:#111923; color:inherit; font-size:13.5px; font-family:inherit; resize:none; min-height:44px; max-height:200px; }
  footer button { padding:0 18px; border-radius:10px; border:1px solid #2b3a4b; background:#1f2a37; color:inherit; font-size:13.5px; font-weight:600; cursor:pointer; }
  footer button.primary { background:#0f7f91; border-color:#0f7f91; color:#fff; }
  footer button:disabled { opacity:.5; cursor:default; }
  .empty { color:#8da0b4; text-align:center; margin-top:60px; font-size:13px; }
</style>
</head>
<body>
<header>
  <div class="title">Claude Code</div>
  <div class="session" id="sessionInfo">会话：—</div>
  <button id="newSessionBtn" title="开始新会话">新会话</button>
  <button id="resumeBtn" title="继续最近一次会话">继续上次</button>
  <button id="settingsBtn">设置</button>
  <button id="backToDsh" class="primary">切回 DSH</button>
</header>

<div id="settingsPanel">
  <div class="grid">
    <div>
      <label>模型（留空 = 默认）</label>
      <input id="setModel" type="text" placeholder="如 claude-sonnet-4-5 / gpt-5.6-sol">
    </div>
    <div>
      <label>权限模式</label>
      <select id="setPermissionMode">
        <option value="acceptEdits">acceptEdits（自动接受编辑）</option>
        <option value="bypassPermissions">bypassPermissions（全部放行）</option>
        <option value="plan">plan（只规划）</option>
        <option value="default">default（默认）</option>
      </select>
    </div>
    <div class="full">
      <label>工作目录（留空 = 默认）</label>
      <input id="setCwd" type="text" placeholder="Claude Code 运行的工作目录">
    </div>
    <div class="full">
      <label>自定义端点 baseURL（留空 = 官方 Anthropic；接 ollama 填 https://ollama.com）</label>
      <input id="setBaseUrl" type="text" placeholder="https://ollama.com">
    </div>
    <div>
      <label>Auth Token（接 ollama 填 key，走 Bearer）</label>
      <input id="setAuthToken" type="password" placeholder="ollama key">
    </div>
    <div>
      <label>API Key（走 x-api-key，一般不用）</label>
      <input id="setApiKey" type="password" placeholder="sk-ant-…">
    </div>
  </div>
  <p class="hint">接 ollama 云：baseURL 填 <code>https://ollama.com</code>、Auth Token 填 ollama key（Bearer 鉴权，不要填 API Key）。用官方 Anthropic 则全部留空即可（走已登录的 OAuth）。</p>
  <div style="margin-top:10px; display:flex; gap:10px;">
    <button id="saveSettingsBtn" class="primary">保存设置</button>
    <button id="closeSettingsBtn">关闭</button>
  </div>
</div>

<main id="chat">
  <div class="empty">输入消息开始与 Claude Code 对话。它会像在终端里一样使用工具（读写文件、执行命令等）。</div>
</main>

<footer>
  <textarea id="input" placeholder="输入消息，Enter 发送，Shift+Enter 换行" rows="1"></textarea>
  <button id="send" class="primary">发送</button>
  <button id="stop" disabled>停止</button>
</footer>

<script>
  const $ = (id) => document.getElementById(id);
  const chat = $('chat');
  let sessionId = null;
  let running = false;
  let currentRunId = null;
  let currentAssistantEl = null;
  let currentTextEl = null;

  function clearEmpty() {
    const e = chat.querySelector('.empty');
    if (e) e.remove();
  }

  function addUser(text) {
    clearEmpty();
    const div = document.createElement('div');
    div.className = 'msg user';
    div.innerHTML = '<div class="bubble"></div><div class="meta">你</div>';
    div.querySelector('.bubble').textContent = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  function addAssistant() {
    clearEmpty();
    const div = document.createElement('div');
    div.className = 'msg assistant';
    div.innerHTML = '<div class="bubble"></div><div class="meta">Claude</div>';
    chat.appendChild(div);
    currentAssistantEl = div;
    currentTextEl = div.querySelector('.bubble');
    return div;
  }

  function appendText(text) {
    if (!currentTextEl) addAssistant();
    currentTextEl.textContent += text;
    chat.scrollTop = chat.scrollHeight;
  }

  function addTool(name, input, id) {
    if (!currentAssistantEl) addAssistant();
    const tool = document.createElement('div');
    tool.className = 'tool';
    tool.innerHTML = '<div class="head"><span class="arrow">▶</span><span class="name"></span></div><div class="body"></div>';
    tool.querySelector('.name').textContent = '🔧 ' + name;
    tool.querySelector('.body').textContent = typeof input === 'string' ? input : JSON.stringify(input, null, 2);
    tool.dataset.toolId = id || '';
    tool.querySelector('.head').addEventListener('click', () => tool.classList.toggle('open'));
    currentAssistantEl.querySelector('.bubble').appendChild(tool);
    chat.scrollTop = chat.scrollHeight;
    return tool;
  }

  function addToolResult(toolUseId, content) {
    if (!currentAssistantEl) addAssistant();
    const tool = currentAssistantEl.querySelector('.tool[data-tool-id="' + (toolUseId || '') + '"]');
    const text = typeof content === 'string' ? content : JSON.stringify(content, null, 2);
    if (tool) {
      tool.querySelector('.body').textContent += '\n\n→ 结果：\n' + text;
    } else {
      const t = addTool('tool_result', text, toolUseId);
      t.querySelector('.name').textContent = '📥 工具结果';
    }
    chat.scrollTop = chat.scrollHeight;
  }

  function addThinking(text) {
    if (!currentAssistantEl) addAssistant();
    const div = document.createElement('div');
    div.className = 'thinking';
    div.textContent = '💭 ' + text;
    currentAssistantEl.querySelector('.bubble').appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  function addResult(ok, text) {
    const div = document.createElement('div');
    div.className = 'result ' + (ok ? 'ok' : 'err');
    div.textContent = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  function setRunning(v) {
    running = v;
    $('send').disabled = v;
    $('stop').disabled = !v;
  }

  function handleEvent(ev) {
    if (!ev) return;
    if (ev.type === 'system' && ev.subtype === 'init') {
      sessionId = ev.session_id || sessionId;
      $('sessionInfo').textContent = '会话：' + (sessionId ? sessionId.slice(0, 8) + '…' : '—');
      return;
    }
    if (ev.type === 'assistant' && ev.message) {
      const blocks = ev.message.content || [];
      for (const b of blocks) {
        if (b.type === 'text' && b.text) appendText(b.text);
        else if (b.type === 'tool_use') addTool(b.name, b.input, b.id);
        else if (b.type === 'thinking' && b.thinking) addThinking(b.thinking);
      }
      return;
    }
    if (ev.type === 'user' && ev.message) {
      const blocks = ev.message.content || [];
      for (const b of blocks) {
        if (b.type === 'tool_result') addToolResult(b.tool_use_id, b.content);
      }
      return;
    }
    if (ev.type === 'stream_event' && ev.event) {
      const e = ev.event;
      if (e.type === 'content_block_delta' && e.delta) {
        if (e.delta.type === 'text_delta' && e.delta.text) appendText(e.delta.text);
        else if (e.delta.type === 'thinking_delta' && e.delta.thinking) addThinking(e.delta.thinking);
      }
      return;
    }
    if (ev.type === 'result') {
      const ok = !ev.is_error && ev.subtype !== 'error_max_turns';
      const cost = ev.total_cost_usd != null ? ' · $' + Number(ev.total_cost_usd).toFixed(4) : '';
      const turns = ev.num_turns != null ? ' · ' + ev.num_turns + ' 轮' : '';
      addResult(ok, (ok ? '✓ 完成' : '✗ ' + (ev.subtype || '出错')) + cost + turns);
      if (ev.session_id) { sessionId = ev.session_id; $('sessionInfo').textContent = '会话：' + sessionId.slice(0, 8) + '…'; }
      setRunning(false);
      currentRunId = null;
      return;
    }
  }

  async function send() {
    const text = $('input').value.trim();
    if (!text || running) return;
    $('input').value = '';
    addUser(text);
    setRunning(true);
    const settings = await window.dshDesktop.claudeGetSettings();
    const payload = {
      prompt: text,
      sessionId: sessionId || null,
      resumeLast: false,
      settings: settings || {},
    };
    const res = await window.dshDesktop.claudeSend(payload);
    if (!res || !res.ok) {
      addResult(false, '启动失败：' + ((res && res.error) || '未知错误'));
      setRunning(false);
      return;
    }
    currentRunId = res.runId;
  }

  $('send').addEventListener('click', send);
  $('input').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });
  $('stop').addEventListener('click', async () => {
    if (currentRunId) await window.dshDesktop.claudeCancel(currentRunId);
    setRunning(false);
    currentRunId = null;
  });
  $('newSessionBtn').addEventListener('click', () => {
    sessionId = null;
    $('sessionInfo').textContent = '会话：—';
    chat.innerHTML = '<div class="empty">已开始新会话。</div>';
  });
  $('resumeBtn').addEventListener('click', async () => {
    const text = $('input').value.trim();
    if (!text || running) return;
    $('input').value = '';
    addUser(text);
    setRunning(true);
    const settings = await window.dshDesktop.claudeGetSettings();
    const res = await window.dshDesktop.claudeSend({ prompt: text, sessionId: null, resumeLast: true, settings: settings || {} });
    if (!res || !res.ok) { addResult(false, '启动失败：' + ((res && res.error) || '未知错误')); setRunning(false); return; }
    currentRunId = res.runId;
  });
  $('backToDsh').addEventListener('click', () => window.dshDesktop.switchMode('dsh'));

  // 设置面板
  $('settingsBtn').addEventListener('click', () => $('settingsPanel').classList.toggle('open'));
  $('closeSettingsBtn').addEventListener('click', () => $('settingsPanel').classList.remove('open'));
  async function loadSettings() {
    const s = await window.dshDesktop.claudeGetSettings();
    if (!s) return;
    $('setModel').value = s.model || '';
    $('setPermissionMode').value = s.permissionMode || 'acceptEdits';
    $('setCwd').value = s.cwd || '';
    $('setBaseUrl').value = s.baseUrl || '';
    $('setAuthToken').value = s.authToken || '';
    $('setApiKey').value = s.apiKey || '';
  }
  $('saveSettingsBtn').addEventListener('click', async () => {
    const res = await window.dshDesktop.claudeSaveSettings({
      model: $('setModel').value.trim(),
      permissionMode: $('setPermissionMode').value,
      cwd: $('setCwd').value.trim(),
      baseUrl: $('setBaseUrl').value.trim(),
      authToken: $('setAuthToken').value.trim(),
      apiKey: $('setApiKey').value.trim(),
    });
    $('settingsPanel').classList.remove('open');
  });
  void loadSettings();

  // 接收主进程流式事件
  window.dshDesktop.onClaudeEvent((ev) => handleEvent(ev));
</script>
</body>
</html>
