name: Android
on:
  push:
    branches: [main]
    paths: ['android/**', 'src/**', 'tests/**', 'scripts/android-ci-shards.cjs', 'assets/**', '.node-version', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', 'src/**', 'tests/**', 'scripts/android-ci-shards.cjs', 'assets/**', '.node-version', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install host test dependencies
        run: npm ci --ignore-scripts
      - uses: actions/setup-go@v6
        with:
          go-version-file: android/tailnet/go.mod
          cache-dependency-path: android/tailnet/go.sum
      - name: SDK and Java
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          android_tools="$ANDROID_HOME/cmdline-tools/latest/bin"
          export PATH="$JAVA_HOME/bin:$android_tools:$ANDROID_HOME/platform-tools:$PATH"
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME" >> "$GITHUB_ENV"
          printf '%s\n' "$JAVA_HOME/bin" "$android_tools" "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          sdkmanager --version
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018'
      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |-
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-android-gradle-${{ hashFiles('android/**/*.gradle', 'android/gradle.properties', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-android-gradle-
      - name: Build embedded networking
        run: bash android/build-tailnet.sh
      - name: Android build, unit tests and lint
        working-directory: android
        run: bash gradlew assembleDebug testDebugUnitTest lintDebug assembleDebugAndroidTest
      - name: Remote protocol tests
        run: node --test tests/android-integration-cleanup.test.js tests/mobile-ui-consistency.test.js tests/remote-access.test.js tests/remote-desktop.test.js tests/remote-approvals.test.js tests/remote-discussions.test.js tests/remote-settings.test.js tests/remote-account-usage.test.js tests/remote-conversation-preview.test.js
      - name: Share instrumentation APKs
        uses: actions/upload-artifact@v7
        with:
          name: android-instrumentation-apks
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          path: |-
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/androidTest/debug/*.apk
      - name: Save Android package and test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: camellia-android-debug-and-reports
          include-hidden-files: true
          path: |-
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/reports/
          retention-days: 14
    name: Package, unit tests and lint
  ui:
    name: UI and gateway / shard ${{ matrix.shard }}
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard:
          - 1
          - 2
          - 3
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install host test dependencies
        run: npm ci --ignore-scripts
      - name: Prepare emulator SDK
        run: |-
          export JAVA_HOME="$JAVA_HOME_17_X64"
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          export PATH="$JAVA_HOME/bin:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          printf '%s\n' "$JAVA_HOME/bin" "$ANDROID_HOME/cmdline-tools/latest/bin" "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          sdkmanager 'platform-tools' 'system-images;android-35;default;x86_64'
      - name: Download this run's instrumentation APKs
        uses: actions/download-artifact@v8
        with:
          name: android-instrumentation-apks
          path: android/app/build/outputs/apk
      - name: Pin Android emulator
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libpulse0
          # Keep the host emulator reproducible; use ANGLE rendering below.
          # Version 36.4.10 and checksum: https://developer.android.com/studio/emulator_archive
          archive="$RUNNER_TEMP/emulator-linux_x64-15004761.zip"
          curl --fail --location --retry 3 --output "$archive" https://redirector.gvt1.com/edgedl/android/repository/emulator-linux_x64-15004761.zip
          echo "58bfdf0572f06ec007a7287154cdc6b2ebfea947d07a1e26a0f6b5e1a39e9191  $archive" | sha256sum --check
          unzip -q "$archive" -d "$RUNNER_TEMP/camellia-emulator"
          echo "EMULATOR=$RUNNER_TEMP/camellia-emulator/emulator/emulator" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/camellia-emulator/emulator/emulator" -version
      - name: Android UI and gateway integration
        timeout-minutes: 30
        shell: bash
        env:
          ANDROID_SERIAL: emulator-5584
          SHARD: ${{ matrix.shard }}
          SHARD_COUNT: "3"
        run: |
          export ADB="$ANDROID_HOME/platform-tools/adb"
          export ANDROID_USER_HOME="$RUNNER_TEMP/camellia-android"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p .ci-logs "$ANDROID_AVD_HOME"
          sudo chmod 666 /dev/kvm
          echo no | avdmanager create avd --name CamelliaCI --package 'system-images;android-35;default;x86_64' --device pixel_4
          test -f "$ANDROID_AVD_HOME/CamelliaCI.ini"
          "$EMULATOR" -list-avds | grep -Fx CamelliaCI
          # Native SwiftShader GLES crashes during activity transitions on this
          # runner; swangle uses ANGLE with the SwiftShader software drivers.
          "$EMULATOR" -avd CamelliaCI -port 5584 -no-window -no-snapshot -no-audio -no-boot-anim -gpu swangle -feature -Vulkan,-WiFiPacketStream -cores 2 > .ci-logs/emulator.log 2>&1 &
          trap '"$ADB" -s "$ANDROID_SERIAL" emu kill || true' EXIT
          timeout 180 "$ADB" -s "$ANDROID_SERIAL" wait-for-device
          for i in $(seq 1 90); do
            if [ "$("$ADB" -s "$ANDROID_SERIAL" shell getprop sys.boot_completed | tr -d '\r')" = 1 ]; then break; fi
            sleep 2
          done
          test "$("$ADB" -s "$ANDROID_SERIAL" shell getprop sys.boot_completed | tr -d '\r')" = 1
          # adbd can close its first connection while the guest finishes booting
          # or switches to root. Verify the resulting identity, not that reply.
          for i in $(seq 1 5); do
            timeout 15 "$ADB" -s "$ANDROID_SERIAL" root || true
            if timeout 30 "$ADB" -s "$ANDROID_SERIAL" wait-for-device &&
              [ "$(timeout 10 "$ADB" -s "$ANDROID_SERIAL" shell id -u | tr -d '\r')" = 0 ]; then break; fi
            sleep 2
          done
          test "$(timeout 10 "$ADB" -s "$ANDROID_SERIAL" shell id -u | tr -d '\r')" = 0
          "$ADB" -s "$ANDROID_SERIAL" install -r android/app/build/outputs/apk/debug/app-debug.apk
          "$ADB" -s "$ANDROID_SERIAL" install -r android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if [ "$SHARD" = 1 ]; then
            node tests/android-pairing-smoke.cjs 2>&1 | tee .ci-logs/android-pairing.log
            node tests/android-gateway-smoke.cjs 2>&1 | tee .ci-logs/android-gateway.log
            node tests/android-discussions-smoke.cjs 2>&1 | tee .ci-logs/android-discussions.log
          fi
          ui_classes=(
            ArtifactInstallTest ChatPreferencesTest InlineVideoTest ModelMenuWidthTest NavigationGlassTest
            RemoteHistoryLoadingTest RemoteUsageTest SentImageGalleryTest WorkbenchScrollTest
            RemoteStartupTest WorkbenchRefreshTest RemoteAutomationTest PendingCommandTest
            RemoteRichControlsTest MobileLayoutRefinementTest RemoteSettingsTest RemoteConnectionTest
            ComputerSelectionTest ConnectionTestDialogTest RemoteComposerInputTest RemoteViewportTest
            RemoteMessageQueueTest NavigationTest PopupPowerSaveTest ArtifactNotificationTest
            DownloadDirectoryTest RemoteConversationStatusTest RemoteAttachmentRenderingTest RemoteKeepAliveTest
            InlineImageTest InlineImageGalleryTest RemoteApiDownloadRetryTest ChatEmptyStateTest
            LocalImageComposerTest MarkdownTest PermissionToolTest PopupCoordinatesTest
            RemoteApiResponseTest RemoteFeedbackTest RemoteSettingsLayoutTest SettingsTest
            UiConsistencyTest SettingsControlsTest SubtaskPageLayoutTest ModernSettingsLayoutTest NavigationVeilTest
          )
          ui_selection="$(node scripts/android-ci-shards.cjs --index "$SHARD" --total "$SHARD_COUNT" "${ui_classes[@]}")"
          printf '%s\n' "$ui_selection" > .ci-logs/android-ui-selection.txt
          if ! "$ADB" -s "$ANDROID_SERIAL" shell am instrument -w -e class "$ui_selection" app.camellia.mobile.test/android.test.InstrumentationTestRunner | tee .ci-logs/android-ui.log; then
            "$ADB" -s "$ANDROID_SERIAL" logcat -d -t 3000 > .ci-logs/android-logcat.txt
            exit 1
          fi
          "$ADB" -s "$ANDROID_SERIAL" logcat -d -t 3000 > .ci-logs/android-logcat.txt
          grep -Eq '^OK \([1-9][0-9]* tests\)' .ci-logs/android-ui.log
      - name: Save shard evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-ui-shard-${{ matrix.shard }}
          include-hidden-files: true
          retention-days: 14
          path: .ci-logs/
  build:
    name: build
    needs:
      - package
      - ui
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require package and every UI shard to pass
        env:
          PACKAGE_RESULT: ${{ needs.package.result }}
          UI_RESULT: ${{ needs.ui.result }}
        run: |-
          test "$PACKAGE_RESULT" = success
          test "$UI_RESULT" = success
