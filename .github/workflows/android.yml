name: Android
on:
  push:
    branches: [main]
    paths: ['android/**', 'src/**', 'tests/**', 'assets/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', 'src/**', 'tests/**', 'assets/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install host test dependencies
        run: npm ci --ignore-scripts
      - uses: actions/setup-go@v6
        with:
          go-version-file: android/tailnet/go.mod
          cache-dependency-path: android/tailnet/go.sum
      - name: SDK and Java
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'system-images;android-35;default;x86_64' 'emulator'
      - name: Build embedded networking
        run: bash android/build-tailnet.sh
      - name: Android build, unit tests and lint
        working-directory: android
        run: bash gradlew assembleDebug testDebugUnitTest lintDebug assembleDebugAndroidTest
      - name: Remote protocol tests
        run: node --test tests/remote-access.test.js tests/remote-desktop.test.js tests/remote-approvals.test.js tests/remote-discussions.test.js tests/remote-settings.test.js
      - name: Android UI and gateway integration
        env:
          ANDROID_SERIAL: emulator-5584
        run: |
          export ADB="$ANDROID_HOME/platform-tools/adb"
          mkdir -p .ci-logs
          sudo chmod 666 /dev/kvm
          echo no | avdmanager create avd --name CamelliaCI --package 'system-images;android-35;default;x86_64' --device pixel_4
          "$ANDROID_HOME/emulator/emulator" -avd CamelliaCI -port 5584 -no-window -no-snapshot -no-audio -no-boot-anim -gpu swiftshader -cores 2 > .ci-logs/emulator.log 2>&1 &
          trap '"$ADB" -s "$ANDROID_SERIAL" emu kill || true' EXIT
          timeout 180 "$ADB" -s "$ANDROID_SERIAL" wait-for-device
          for i in $(seq 1 90); do
            if [ "$("$ADB" -s "$ANDROID_SERIAL" shell getprop sys.boot_completed | tr -d '\r')" = 1 ]; then break; fi
            sleep 2
          done
          "$ADB" -s "$ANDROID_SERIAL" root
          "$ADB" -s "$ANDROID_SERIAL" wait-for-device
          node tests/android-pairing-smoke.cjs
          node tests/android-gateway-smoke.cjs
          node tests/android-discussions-smoke.cjs
          "$ADB" -s "$ANDROID_SERIAL" shell am instrument -w -e class app.camellia.mobile.RemoteAutomationTest,app.camellia.mobile.PendingCommandTest,app.camellia.mobile.RemoteRichControlsTest,app.camellia.mobile.MobileLayoutRefinementTest,app.camellia.mobile.RemoteSettingsTest,app.camellia.mobile.RemoteConnectionTest,app.camellia.mobile.RemoteComposerInputTest,app.camellia.mobile.RemoteViewportTest,app.camellia.mobile.RemoteMessageQueueTest,app.camellia.mobile.NavigationTest app.camellia.mobile.test/android.test.InstrumentationTestRunner | tee .ci-logs/android-ui.log
          grep -q '^OK (' .ci-logs/android-ui.log
      - name: Save Android package and test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: camellia-android-debug-and-reports
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/reports/
            .ci-logs/
          retention-days: 14
