name: Desktop

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }} / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-latest
            arch: x64
            command: dist:win
            bundle: dist/win-unpacked
          - platform: macos
            runner: macos-15
            arch: arm64
            command: dist:mac
            bundle: dist/mac-arm64/Camellia.app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          architecture: ${{ matrix.arch }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            runtimes/*/package-lock.json
      - run: npm ci
      - name: Prepare engines used by integration tests
        run: npm run setup:runtimes -- claude codex dsh kimi antigravity
      - name: Prepare the Antigravity subscription CLI
        run: npm run setup:antigravity:subscription
      - run: npm test
      - name: Electron smoke test
        run: node tests/electron-smoke.cjs
      - name: Native DSH settings
        run: node tests/native-settings-electron.cjs
      - name: Kimi ACP smoke test
        run: npm run test:kimi
      - name: Codex app-server smoke test
        run: npm run test:codex
      - name: Antigravity SDK smoke test
        run: npm run test:antigravity
      - name: Antigravity subscription CLI smoke test
        run: npm run test:antigravity:subscription
      - name: Benchmark harnesses smoke test
        run: npm run test:benchmark
      - name: Benchmark DSH limits smoke test
        run: node tests/benchmark-dsh-limits-smoke.cjs
      - name: Native tools audit
        run: npm run test:tools
      - name: Kimi subscription protocol smoke test
        run: node tests/kimi-subscription-smoke.cjs
      - name: Shared conversations smoke test
        run: node tests/shared-native-smoke.cjs
      - name: Claude CLI resume smoke test
        run: node tests/claude-cli-resume.cjs "${{ github.workspace }}/runtimes/claude/node_modules/@anthropic-ai/claude-code/bin/claude.exe"
      - name: API router CLI smoke test
        run: node tests/api-router-cli-smoke.cjs "${{ github.workspace }}/runtimes/claude/node_modules/@anthropic-ai/claude-code/bin/claude.exe"
      - name: Kimi desktop UI smoke test
        run: node tests/kimi-desktop-smoke.cjs
      - name: Build desktop artifacts
        run: npm run ${{ matrix.command }} -- --publish never
      - name: Verify lightweight package and download manifests
        run: node tests/verify-package.cjs "${{ matrix.bundle }}"
      - name: Verify optional engine downloads with bundled installer tools
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = macos ]; then
            node tests/optional-download-electron.cjs "${{ matrix.bundle }}/Contents/Resources"
            node tests/runtime-install-smoke.cjs "${{ matrix.bundle }}/Contents/Resources" --all
          else
            node tests/optional-download-electron.cjs "${{ matrix.bundle }}/resources"
            node tests/runtime-install-smoke.cjs "${{ matrix.bundle }}/resources" --all
          fi
      - name: Verify Windows portable extraction and startup
        if: matrix.platform == 'windows'
        run: node tests/portable-smoke.cjs
      - uses: actions/upload-artifact@v7
        with:
          name: Camellia-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
