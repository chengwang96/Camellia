name: Desktop

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.platform }} / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-latest
            arch: x64
            command: dist:win
            bundle: dist/win-unpacked
          - platform: macos
            runner: macos-15
            arch: arm64
            command: dist:mac
            bundle: dist/mac-arm64/Camellia.app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          architecture: ${{ matrix.arch }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            runtimes/*/package-lock.json
      - run: npm ci
      - uses: actions/setup-go@v6
        with:
          go-version-file: integrations/tailnet/go.mod
          cache-dependency-path: integrations/tailnet/go.sum
      - name: Embedded network tests
        working-directory: integrations/tailnet
        run: go test ./...
      - name: Build embedded network helper
        run: npm run build:tailnet
      - name: Build macOS discussion supervisor
        if: matrix.platform == 'macos'
        run: node scripts/build-discussion-helper.cjs
      - name: Embedded network native smoke test
        run: node tests/embedded-network-electron.cjs
      - name: Prepare engines used by integration tests
        run: npm run setup:runtimes -- claude codex dsh kimi antigravity grok
      - name: Prepare the Antigravity subscription CLI
        run: npm run setup:antigravity:subscription
      # Kimi's Glob/Grep tools shell out to ripgrep. Install it explicitly on
      # both runners so the audit does not depend on the image's preinstalled
      # tools or Kimi's automatic bootstrap reaching the network.
      - name: Install ripgrep for the native tool audit (Windows)
        if: matrix.platform == 'windows'
        run: choco install ripgrep --no-progress -y
      - name: Install ripgrep for the native tool audit (macOS)
        if: matrix.platform == 'macos'
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            brew install ripgrep
          fi
      - name: Verify ripgrep is available to native tools
        run: rg --version
      - name: Unit tests
        timeout-minutes: 10
        run: node --test --test-force-exit tests/*.test.js
      - name: Diagnostic pipe disconnection
        run: node tests/diagnostic-output-electron.cjs
      - name: Electron smoke test
        run: node tests/electron-smoke.cjs
      - name: Data directory migration smoke test
        run: node tests/data-directory-electron.cjs
      - name: Data directory migration progress window
        env:
          CAMELLIA_DIRECTORY_PROGRESS_TEST_VISIBLE: '1'
        run: node tests/data-directory-progress-electron.cjs
      - name: Native DSH settings
        run: node tests/native-settings-electron.cjs
      - name: Kimi ACP smoke test
        run: npm run test:kimi
      - name: Grok ACP smoke test
        run: npm run test:grok
      - name: Codex app-server smoke test
        run: npm run test:codex
      - name: Native discussion workflow
        run: node tests/discussion-production-smoke.cjs --engine codex
      - name: Antigravity SDK smoke test
        run: npm run test:antigravity
      - name: Antigravity subscription CLI smoke test
        run: npm run test:antigravity:subscription
      - name: Benchmark harnesses smoke test
        run: npm run test:benchmark
      - name: Benchmark DSH limits smoke test
        run: node tests/benchmark-dsh-limits-smoke.cjs
      - name: Native tools audit
        run: npm run test:tools
      - name: Kimi subscription protocol smoke test
        run: node tests/kimi-subscription-smoke.cjs
      - name: Shared conversations smoke test
        run: node tests/shared-native-smoke.cjs
      - name: Claude CLI resume smoke test
        run: node tests/claude-cli-resume.cjs "${{ github.workspace }}/runtimes/claude/node_modules/@anthropic-ai/claude-code/bin/claude.exe"
      - name: API router CLI smoke test
        run: node tests/api-router-cli-smoke.cjs "${{ github.workspace }}/runtimes/claude/node_modules/@anthropic-ai/claude-code/bin/claude.exe"
      - name: Kimi desktop UI smoke test
        run: node tests/kimi-desktop-smoke.cjs
      - name: Build desktop artifacts
        run: npm run ${{ matrix.command }} -- --publish never
      - name: Verify lightweight package and download manifests
        run: node tests/verify-package.cjs "${{ matrix.bundle }}"
      - name: Verify packaged macOS discussion supervision
        if: matrix.platform == 'macos'
        shell: bash
        run: CAMELLIA_DISCUSSION_HELPER="$PWD/${{ matrix.bundle }}/Contents/Resources/runtime/camellia-discussion-job" node --test tests/discussion-unix-job.test.js
      - name: Verify optional engine downloads with bundled installer tools
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = macos ]; then
            node tests/optional-download-electron.cjs "${{ matrix.bundle }}/Contents/Resources"
            node tests/runtime-install-smoke.cjs "${{ matrix.bundle }}/Contents/Resources" --all
          else
            node tests/optional-download-electron.cjs "${{ matrix.bundle }}/resources"
            node tests/runtime-install-smoke.cjs "${{ matrix.bundle }}/resources" --all
          fi
      - name: Verify Windows portable extraction and startup
        if: matrix.platform == 'windows'
        run: node tests/portable-smoke.cjs
      - name: Upload smoke diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-diagnostics-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            dist/tools-native-audit*.json
            dist/benchmark-native-smoke.json
            dist/antigravity-sdk-diagnostics.json
            dist/antigravity-subscription-diagnostics.json
            dist/grok-smoke-diagnostics.json
      - name: Upload desktop candidates for acceptance
        uses: actions/upload-artifact@v7
        with:
          name: desktop-candidate-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip

  acceptance:
    name: Acceptance / ${{ matrix.platform }} / ${{ matrix.arch }}
    needs: build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-latest
            arch: x64
            bundle: dist/win-unpacked
          - platform: macos
            runner: macos-15
            arch: arm64
            bundle: dist/mac-arm64/Camellia.app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          architecture: ${{ matrix.arch }}
          cache: npm
      # Only verification libraries are needed here; the app and its Electron
      # runtime come from the build job's release ZIP, not npm lifecycle hooks.
      - name: Install package verification dependencies
        run: npm ci --ignore-scripts
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install packaged desktop UI test driver
        run: python -m pip install playwright==1.61.0
      - name: Download this run's desktop candidates
        uses: actions/download-artifact@v8
        with:
          name: desktop-candidate-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist
      - name: Extract the Windows release ZIP
        if: matrix.platform == 'windows'
        timeout-minutes: 3
        shell: pwsh
        run: |
          $manifest = Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json
          $archive = Join-Path dist "$($manifest.build.productName)-$($manifest.version)-win-${{ matrix.arch }}.zip"
          Expand-Archive -LiteralPath $archive -DestinationPath "${{ matrix.bundle }}"
      # Upload the ZIP as a file and use ditto to retain the app's executable
      # permissions and symlinks across runners.
      - name: Extract the macOS release ZIP
        if: matrix.platform == 'macos'
        timeout-minutes: 3
        shell: bash
        run: |
          product=$(node -p "require('./package.json').build.productName")
          version=$(node -p "require('./package.json').version")
          ditto -x -k "dist/$product-$version-macOS-${{ matrix.arch }}.zip" dist/mac-arm64
      - name: Verify downloaded package and download manifests
        run: node tests/verify-package.cjs "${{ matrix.bundle }}"
      - name: Accept the packaged desktop GUI
        # Fresh and upgrade scenarios each use an empty profile and npm cache.
        # Allow cold Windows downloads to finish before checking the real GUI.
        timeout-minutes: 20
        run: python tests/packaged-desktop-ui.py --bundle "${{ matrix.bundle }}" --install-timeout 480 --output dist/packaged-desktop-bundle
      - name: Install the final Windows NSIS artifact
        if: matrix.platform == 'windows'
        id: installed
        timeout-minutes: 4
        shell: pwsh
        run: |
          $manifest = Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json
          ./tests/install-desktop-ci.ps1 -Installer "dist/Camellia-Setup-$($manifest.version)-win-x64.exe"
      - name: Verify installed files match the build
        if: matrix.platform == 'windows'
        run: node tests/verify-package.cjs "${{ steps.installed.outputs.bundle }}"
      - name: Accept the installed GUI through its desktop shortcut
        if: matrix.platform == 'windows'
        timeout-minutes: 20
        run: python tests/packaged-desktop-ui.py --bundle "${{ steps.installed.outputs.bundle }}" --shortcut "${{ steps.installed.outputs.shortcut }}" --install-timeout 480 --output dist/packaged-desktop-installed
      - name: Save packaged desktop acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-acceptance-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            dist/packaged-desktop-bundle/
            dist/packaged-desktop-installed/
      - name: Upload accepted desktop artifacts
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: Camellia-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
